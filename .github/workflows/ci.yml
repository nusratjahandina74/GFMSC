name: CI
on:
  push: { branches: [main, master] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      TEST_MONGO_URI: mongodb://localhost:27017/gfmsc_ci?replicaSet=rs0&directConnection=true
      REQUIRE_TRANSACTIONS: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Start MongoDB 7 as a single-node REPLICA SET (real transactions + atomic findAndModify)
        working-directory: .
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "1" && break || sleep 2; done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && break || sleep 2; done
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm test
      - name: Dependency audit (production deps, fail on high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true   # tighten to a hard failure once node-cron 4 is adopted (see TEST_STATUS)

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm run lint --if-present
        continue-on-error: true

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fail if a real secret is committed
        run: |
          ! git grep -nE "(mongodb\+srv://[^<\s]+:[^<\s]+@|re_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC )?PRIVATE KEY-----)" -- . ':!*.md' ':!package-lock.json'
